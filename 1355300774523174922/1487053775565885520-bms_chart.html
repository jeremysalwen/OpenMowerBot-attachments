<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMS — Spannung & Strom</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Space+Grotesk:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f14;
    --surface: #13161e;
    --border: #1e2330;
    --volt-color: #4af0c4;
    --curr-pos-color: #60a5fa;
    --curr-neg-color: #f87171;
    --text-primary: #e2e8f0;
    --text-muted: #64748b;
    --grid: #1a1f2e;
  }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    padding: 2rem;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 1.5rem;
    margin-bottom: 1.5rem;
  }

  header h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.1rem;
    font-weight: 400;
    letter-spacing: 0.08em;
    color: var(--text-primary);
  }

  header .sub {
    font-size: 0.78rem;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
  }

  .metrics {
    display: flex;
    gap: 2rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
  }

  .metric {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .metric-label {
    font-size: 0.68rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-family: 'JetBrains Mono', monospace;
  }

  .metric-value {
    font-size: 1.05rem;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
  }

  .metric-value.volt { color: var(--volt-color); }
  .metric-value.curr-pos { color: var(--curr-pos-color); }
  .metric-value.curr-neg { color: var(--curr-neg-color); }
  .metric-value.neutral { color: var(--text-primary); }

  .chart-container {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.5rem 1.5rem 1rem;
    margin-bottom: 1rem;
    position: relative;
  }

  .chart-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.7rem;
  }

  .legend-line {
    width: 20px;
    height: 2px;
    border-radius: 1px;
  }

  canvas {
    display: block;
    width: 100%;
  }

  .tooltip {
    position: fixed;
    background: #1e2433;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.1s;
    z-index: 100;
    line-height: 1.8;
  }

  .crosshair {
    position: absolute;
    top: 0; bottom: 0;
    width: 1px;
    background: rgba(255,255,255,0.12);
    pointer-events: none;
    display: none;
  }
</style>
</head>
<body>

<header>
  <h1>BMS Monitor</h1>
  <span class="sub" id="duration-label">—</span>
</header>

<div class="metrics" id="metrics-bar">
  <div class="metric"><span class="metric-label">∅ Spannung</span><span class="metric-value volt" id="m-vavg">—</span></div>
  <div class="metric"><span class="metric-label">V min / max</span><span class="metric-value volt" id="m-vrange">—</span></div>
  <div class="metric"><span class="metric-label">I max (Laden)</span><span class="metric-value curr-pos" id="m-imax">—</span></div>
  <div class="metric"><span class="metric-label">I min (Entladen)</span><span class="metric-value curr-neg" id="m-imin">—</span></div>
  <div class="metric"><span class="metric-label">SOC</span><span class="metric-value neutral">99.0 %</span></div>
  <div class="metric"><span class="metric-label">Datenpunkte</span><span class="metric-value neutral" id="m-n">—</span></div>
</div>

<div class="chart-container" id="box-volt">
  <div class="chart-title">
    <span>Spannung</span>
    <span class="legend-item"><span class="legend-line" style="background:var(--volt-color)"></span>V (Volt)</span>
  </div>
  <div style="position:relative">
    <canvas id="cv-volt" height="200"></canvas>
    <div class="crosshair" id="ch-volt"></div>
  </div>
</div>

<div class="chart-container" id="box-curr">
  <div class="chart-title">
    <span>Strom</span>
    <span class="legend-item"><span class="legend-line" style="background:var(--curr-pos-color)"></span>+ Laden</span>
    <span class="legend-item"><span class="legend-line" style="background:var(--curr-neg-color)"></span>− Entladen</span>
  </div>
  <div style="position:relative">
    <canvas id="cv-curr" height="200"></canvas>
    <div class="crosshair" id="ch-curr"></div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

const rows = RAW.trim().split('\n').map(l => {
  const [t,v,i,temp] = l.split(',');
  return { t: parseInt(t), v: parseFloat(v), i: parseFloat(i), temp: parseFloat(temp) };
});

const t0 = rows[0].t;
const xs = rows.map(r => (r.t - t0) / 1000);
const vs = rows.map(r => r.v);
const is = rows.map(r => r.i);
const n = rows.length;
const dur = xs[n-1];

// metrics
document.getElementById('duration-label').textContent = `${(dur/60).toFixed(1)} min · ${n} Punkte · Δt≈60s`;
document.getElementById('m-n').textContent = n;
document.getElementById('m-vavg').textContent = (vs.reduce((a,b)=>a+b,0)/n).toFixed(3) + ' V';
document.getElementById('m-vrange').textContent = Math.min(...vs).toFixed(2) + ' / ' + Math.max(...vs).toFixed(2) + ' V';
document.getElementById('m-imax').textContent = '+' + Math.max(...is).toFixed(3) + ' A';
document.getElementById('m-imin').textContent = Math.min(...is).toFixed(3) + ' A';

// --- canvas chart engine ---
function drawChart(canvasId, data, opts) {
  const canvas = document.getElementById(canvasId);
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.offsetWidth;
  const H = canvas.offsetHeight || 200;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const PAD = { top: 12, right: 20, bottom: 36, left: 56 };
  const pw = W - PAD.left - PAD.right;
  const ph = H - PAD.top - PAD.bottom;

  const xMin = 0, xMax = xs[xs.length-1];
  const rawYMin = Math.min(...data), rawYMax = Math.max(...data);
  const yPad = (rawYMax - rawYMin) * 0.15 || 0.02;
  const yMin = opts.yMin !== undefined ? opts.yMin : rawYMin - yPad;
  const yMax = opts.yMax !== undefined ? opts.yMax : rawYMax + yPad;

  const px = x => PAD.left + ((x - xMin) / (xMax - xMin)) * pw;
  const py = y => PAD.top + ph - ((y - yMin) / (yMax - yMin)) * ph;

  // grid
  ctx.strokeStyle = '#1a1f2e';
  ctx.lineWidth = 1;
  const yTicks = 5;
  for (let i = 0; i <= yTicks; i++) {
    const yv = yMin + (yMax - yMin) * (i / yTicks);
    const yp = py(yv);
    ctx.beginPath(); ctx.moveTo(PAD.left, yp); ctx.lineTo(PAD.left + pw, yp); ctx.stroke();
    ctx.fillStyle = '#4a5568';
    ctx.font = '10px JetBrains Mono, monospace';
    ctx.textAlign = 'right';
    ctx.fillText(yv.toFixed(opts.decimals || 2), PAD.left - 6, yp + 3.5);
  }

  // x ticks every ~5 min
  const xStep = 300;
  for (let xv = 0; xv <= xMax; xv += xStep) {
    const xp = px(xv);
    ctx.beginPath(); ctx.strokeStyle = '#1a1f2e'; ctx.moveTo(xp, PAD.top); ctx.lineTo(xp, PAD.top + ph); ctx.stroke();
    ctx.fillStyle = '#4a5568';
    ctx.font = '10px JetBrains Mono, monospace';
    ctx.textAlign = 'center';
    ctx.fillText((xv/60).toFixed(0) + ' min', xp, PAD.top + ph + 20);
  }

  // zero line for current
  if (opts.zeroLine) {
    const zp = py(0);
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(PAD.left, zp); ctx.lineTo(PAD.left + pw, zp); ctx.stroke();
    ctx.setLineDash([]);
  }

  // fill area
  if (opts.fillPositive || opts.fillNegative) {
    const zp = py(0);
    // positive fill
    ctx.beginPath();
    ctx.moveTo(px(xs[0]), zp);
    xs.forEach((x, i) => { if (data[i] >= 0) ctx.lineTo(px(x), py(data[i])); else ctx.lineTo(px(x), zp); });
    ctx.lineTo(px(xs[n-1]), zp);
    ctx.closePath();
    ctx.fillStyle = 'rgba(96,165,250,0.07)';
    ctx.fill();
    // negative fill
    ctx.beginPath();
    ctx.moveTo(px(xs[0]), zp);
    xs.forEach((x, i) => { if (data[i] <= 0) ctx.lineTo(px(x), py(data[i])); else ctx.lineTo(px(x), zp); });
    ctx.lineTo(px(xs[n-1]), zp);
    ctx.closePath();
    ctx.fillStyle = 'rgba(248,113,113,0.07)';
    ctx.fill();
  } else {
    // simple fill below
    ctx.beginPath();
    ctx.moveTo(px(xs[0]), py(data[0]));
    xs.forEach((x, i) => ctx.lineTo(px(x), py(data[i])));
    ctx.lineTo(px(xs[n-1]), PAD.top + ph);
    ctx.lineTo(px(xs[0]), PAD.top + ph);
    ctx.closePath();
    ctx.fillStyle = 'rgba(74,240,196,0.04)';
    ctx.fill();
  }

  // line — colored by sign for current
  if (opts.colorBySign) {
    for (let i = 1; i < n; i++) {
      const color = data[i] >= 0 ? '#60a5fa' : '#f87171';
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.moveTo(px(xs[i-1]), py(data[i-1]));
      ctx.lineTo(px(xs[i]), py(data[i]));
      ctx.stroke();
    }
  } else {
    ctx.beginPath();
    ctx.strokeStyle = opts.color;
    ctx.lineWidth = 1.5;
    ctx.lineJoin = 'round';
    xs.forEach((x, i) => i === 0 ? ctx.moveTo(px(x), py(data[i])) : ctx.lineTo(px(x), py(data[i])));
    ctx.stroke();
  }

  // axes labels
  ctx.fillStyle = '#4a5568';
  ctx.font = '10px JetBrains Mono, monospace';
  ctx.textAlign = 'right';
  ctx.save(); ctx.translate(14, PAD.top + ph/2); ctx.rotate(-Math.PI/2);
  ctx.textAlign = 'center'; ctx.fillText(opts.unit, 0, 0); ctx.restore();

  ctx.textAlign = 'center';
  ctx.fillText('Zeit (min)', PAD.left + pw/2, H - 4);

  // store layout info for tooltip
  canvas._chart = { px, py, PAD, pw, ph, yMin, yMax, data };
}

function drawBoth() {
  drawChart('cv-volt', vs, { color: '#4af0c4', unit: 'V', decimals: 2, yMin: 29.10, yMax: 29.42 });
  drawChart('cv-curr', is, { colorBySign: true, fillPositive: true, fillNegative: true, unit: 'A', decimals: 3, zeroLine: true });
}

drawBoth();
window.addEventListener('resize', drawBoth);

// tooltip + crosshair
const tooltip = document.getElementById('tooltip');

function setupHover(canvasId, crosshairId, dataArr, unit, label) {
  const canvas = document.getElementById(canvasId);
  const ch = document.getElementById(crosshairId);

  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const c = canvas._chart;
    if (!c) return;
    const fracX = (mx - c.PAD.left) / c.pw;
    if (fracX < 0 || fracX > 1) { tooltip.style.opacity=0; ch.style.display='none'; return; }
    const xi = Math.round(fracX * (xs.length-1));
    const xv = xs[xi];
    const val = dataArr[xi];

    ch.style.display = 'block';
    ch.style.left = (c.PAD.left + fracX * c.pw) + 'px';

    const color = unit === 'A' ? (val >= 0 ? '#60a5fa' : '#f87171') : '#4af0c4';
    tooltip.innerHTML = `<span style="color:#64748b">t</span> <span style="color:#e2e8f0">${(xv/60).toFixed(2)} min</span><br><span style="color:#64748b">${label}</span> <span style="color:${color}">${val >= 0 ? '+' : ''}${val.toFixed(3)} ${unit}</span><br><span style="color:#64748b">T</span> <span style="color:#e2e8f0">${rows[xi].temp.toFixed(1)} °C</span>`;
    tooltip.style.opacity = 1;
    tooltip.style.left = (e.clientX + 14) + 'px';
    tooltip.style.top = (e.clientY - 20) + 'px';
  });

  canvas.addEventListener('mouseleave', () => {
    tooltip.style.opacity = 0;
    ch.style.display = 'none';
  });
}

setupHover('cv-volt', 'ch-volt', vs, 'V', 'U');
setupHover('cv-curr', 'ch-curr', is, 'A', 'I');
